<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora por método de Bisección</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora por método de Bisección</h1>
        <div class="input-container">
            <label for="polynomial">Ingrese el polinomio:</label>
            <input type="text" id="polynomial" placeholder="Ejemplo: x^2 - 4">
        </div>
        <div class="input-container">
            <label for="intervalA">Límite inferior (a):</label>
            <input type="number" id="intervalA" placeholder="Ejemplo: 1">
        </div>
        <div class="input-container">
            <label for="intervalB">Límite superior (b):</label>
            <input type="number" id="intervalB" placeholder="Ejemplo: 3">
        </div>
        <button id="calculateButton">Calcular</button>
        <div id="result">
            <!-- Result will be displayed here -->
        </div>
        <div id="note">
            <p><strong>Nota:</strong> La función debe ser continua en el intervalo dado, incluyendo los extremos. De lo contrario, se generará un error.</p>
        </div>
    </div>

    <script src="../src/renderer.js"></script>
</body>
</html>
